name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototype/requirements.txt
      - run: python -m unittest discover -s tests
        working-directory: prototype
      - run: python tools/test_character_pipeline.py
      - run: python tools/test_character_studio.py
      - run: python tools/test_native_sd.py
      - run: python tools/test_sd_atelier.py
      - run: python tools/test_atelier.py
      - run: python tools/test_release.py
      - run: python tools/test_character_customization.py
      - run: python tools/test_components.py ComponentsTests
